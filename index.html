<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Tailwind -->
    <link rel="stylesheet" href="output.css">
    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

    <title>Group 3 Website Project</title>
    <style>
        body {
            padding-top: 5rem;
            font-family: 'Outfit', sans-serif;
        }
    </style>
</head>

<body class="w-screen">

    <div id="header"></div>
    <div id="page-wrapper" class="relative w-full">
        <div id="hero"></div>
        <div id="footer"></div>
    </div>

    <!-- 1. Load GSAP and ScrollTrigger CDN Libraries directly in index.html -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>

    <script>
        // Tell GSAP to register the ScrollTrigger plugin
        gsap.registerPlugin(ScrollTrigger);

        const loadComponents = (id, url, callback) => {
            fetch(url)
                .then((response) => response.text())
                .then((html) => {
                    document.getElementById(id).innerHTML = html;
                    if (typeof callback === 'function') {
                        callback();
                    }
                });
        }

        const initHeaderToggle = () => {
            const menu = document.getElementById('menu');
            const icon = document.querySelectorAll('.icons');
            const iconDiv = document.getElementById('dropdown');
            if (!iconDiv || !menu) return;
            iconDiv.addEventListener('click', () => {
                menu.classList.toggle('hidden');
                icon.forEach((stuff) => {
                    stuff.classList.toggle('hidden');
                });
            });
        };

        // This function will dynamically load and execute hero.js once the hero section is on the page
        const initHeroAnimations = () => {
            const script = document.createElement('script');
            script.src = 'src/sections/hero.js';
            document.body.appendChild(script);
        };

        window.onload = () => {
            loadComponents('header', 'src/sections/header.html', initHeaderToggle);

            // Pass the initHeroAnimations function as a callback so it only runs when hero.html is fully loaded
            loadComponents('hero', 'src/sections/hero.html', initHeroAnimations);

            loadComponents('footer', 'src/sections/footer.html');
        }
    </script>
</body>

</html>
