<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="output.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <title>Group 3 Website Project</title>
    <style>
        body {
            padding-top: 5rem;
            font-family: 'Outfit', sans-serif;
        }
    </style>
</head>
<body>
    <div id="header"></div>
    <div id="hero"></div>
    <div id="footer"></div>

    <script>
    const loadComponent = (id, url) => {
        return fetch(url)
            .then((response) => response.text())
            .then((html) => {
                document.getElementById(id).innerHTML = html;
            });
    };

    window.addEventListener('load', () => {
        Promise.all([
            loadComponent('header', 'src/sections/header.html'),
            loadComponent('hero', 'src/sections/hero.html'),
            loadComponent('footer', 'src/sections/footer.html')
        ]).then(() => {
            const heroShape = document.getElementById('hero-shape');
            if (heroShape) {
                heroShape.style.position = 'sticky';
                heroShape.style.top = '0';
                heroShape.style.zIndex = '60';
            }
        });
    });
    </script>
</body>
</html>
