<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="output.css">
    <title>Group 3 Website Project</title>
    <script>
        async function loadComponent(id, url) {
            const element = document.getElementById(id);
            if (!element) return;
            try {
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`Failed to load ${url}: ${response.status}`);
                }
                element.innerHTML = await response.text();
            } catch (error) {
                console.error(error);
                element.innerHTML = `<div class="p-6 text-red-600">Unable to load section: ${id}</div>`;
            }
        }

        window.onload = () => {
            loadComponent('header', 'src/sections/header.html');
            loadComponent('hero', 'src/sections/hero.html');
            loadComponent('contact', 'src/sections/contact.html');
            loadComponent('footer', 'src/sections/footer.html');
        };
    </script>
</head>
<body>
    <div id="header"></div>
    <div id="hero"></div>
    <div id="contact"></div>
    <div id="footer"></div>
</body>
</html>
