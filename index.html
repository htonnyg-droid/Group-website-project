<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Tailwind -->
    <link rel="stylesheet" href="output.css">
    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

    <title>Group 3 Website Project</title>
    <style>
        body {
            padding-top: 5rem;
            font-family: 'Outfit', sans-serif;
        }
    </style>
</head>
<body>
<script>
    const loadComponents = (id, url, callback = null) => {
        fetch(url)
            .then((response) => response.text())
            .then((html) => {
                document.getElementById(id).innerHTML = html;

                if (callback) {
                    callback();
                }
            });
    }

    const initNavbarToggle = () => {
        const menu = document.getElementById('menu');
        const icon = document.querySelectorAll('.icons');
        const iconDiv = document.getElementById('dropdown');

        if (iconDiv) {
            iconDiv.addEventListener('click', () => {
                menu.classList.toggle('hidden');
                icon.forEach((stuff) => {
                    stuff.classList.toggle('hidden');
                });
            });
        }
    }

    window.onload = () => {
        loadComponents('header', 'src/sections/header.html', initNavbarToggle);
        loadComponents('hero', 'src/sections/hero.html');
        loadComponents('footer', '/src/sections/footer.html');
    }
</script>
<body>
    <div id="header"></div>
    <div id="page-wrapper" class="relative w-full">
        <div id="hero"></div>
        <div id="footer"></div>
    </div>
</html>
