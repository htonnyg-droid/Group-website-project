<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Tailwind -->
    <link rel="stylesheet" href="output.css">
    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

    <title>Group 3 Website Project</title>
    <style>
        body {
            padding-top: 5rem;
            font-family: 'Outfit', sans-serif;
        }
    </style>
</head>
<body class="w-screen bg-green-50">
<script>
    const loadComponents = (id, url) =>  {
        fetch(url)
        .then((response) => response.text())
        .then((html) => {
            const container = document.getElementById(id);
            container.innerHTML = html;

            container.querySelectorAll('script').forEach((oldScript) => {
                const newScript = document.createElement('script');
                Array.from(oldScript.attributes).forEach((attr) => {
                    newScript.setAttribute(attr.name, attr.value);
                });
                newScript.textContent = oldScript.textContent;
                oldScript.replaceWith(newScript);
            });
        });
    }

    window.onload = () => {
        loadComponents('header', 'src/sections/header.html');
        loadComponents('hero', 'src/sections/hero.html');
        //loadComponents('contact', 'src/sections/contact.html');
        loadComponents('footer', '/src/sections/footer.html');
    }

    
</script>
<body>
    <div id="header"></div>
    <div id="page-wrapper" class="relative w-full">
        <div id="hero"></div>
        <div id="footer"></div>
    </div>
</html>
