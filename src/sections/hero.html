<div id="graphs">

    <div class="overflow-x-hidden"></div>

    <div id="graphs-container" class="relative h-104.75 md:h-222.25 lg:h-256.75 w-98.25 md:w-208.5 lg:w-378.5  mx-auto my-32">
        <div class="absolute md:hidden lg:block text-white font-medium text-[22px] lg:text-[48px] z-10 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2">
            <p>We help you set</p>
            <p id="text1">focus and gain</p>
            <p>impact. By adding</p>
            <p id="text2"> to the conversation,</p>
            <p id="text3">not to the noise</p>
        </div>
        <!--yellow-->
        <img src="/src/Vectors/yellow.png" alt="" id="yellow" class="absolute h-90 md:h-190.75 lg:h-218.25 w-74.75 md:w-158.75 lg:w-181.5 left-0 top-0 z-7">
        <!--green left-->
        <img src="/src/Vectors/greenLeft.png" alt="" id="green" class="absolute h-55.5 md:h-118 lg:h-135 w-54 md:w-114.5 lg:w-131 left-[3%] lg:left-[20%] top-[10%] lg:top-[15%] z-9 lg:z-8">
        <!--Blue-->
        <img src="/src/Vectors/blue.png" alt="" id="blue" class="absolute h-62.5 md:h-132.25 lg:h-164.75 w-66.75 md:w-141.25 lg:w-176 right-[5%] lg:right-[12.5%] z-8 lg:z-9 top-[15%]">
        <!--pink-->
        <img src="/src/Vectors/pink.png" alt="" id="pink" class="absolute h-38.75 md:h-82.5 lg:h-94.25 w-24.25 md:w-51.5 lg:w-59 right-[10%] lg:left-[40%] top-[5%] z-6">
        <!--green far right-->
        <img src="/src/Vectors/greenRight.png" alt="" id="greenRight" class="absolute h-80 md:h-169.75 lg:h-194 w-41.75 md:w-88.75 lg:w-101.5 right-0 bottom-0 lg:bottom-[-10%] z-7">
        <!--red-->
        <img src="/src/Vectors/red.png" alt="" id="red" class="absolute h-43 md:h-91.25 lg:h-104.5 w-74.25 md:w-157.75 lg:w-180.25 left-[20%] lg:left-[15%] bottom-[10%] lg:bottom-[5%] z-8 lg:z-7">
    </div>
    <script>
        const yellow = document.getElementById('yellow');
        const pink = document.getElementById('pink');
        const blue = document.getElementById('blue');
        const green = document.getElementById('green');
        const greenright = document.getElementById('greenright');
        const red = document.getElementById('red');
        const text1 = document.getElementById('text1');
        const text2 = document.getElementById('text2');
        const text3 = document.getElementById('text3');

        const isLg = () => window.innerWidth >= 1024;
        const boxes = [yellow, pink, blue, green, red];
        const cache = new Map();

        function getDocTop(el) {
            return el.getBoundingClientRect().top + window.scrollY;
        }

        function cachePositions() {
            boxes.forEach(el => {
                // Reset any inline styles before measuring
                el.style.position = '';
                el.style.top = '';
                el.style.left = '';
                el.style.width = '';

                const rect = el.getBoundingClientRect();
                cache.set(el, {
                    docTop: rect.top + window.scrollY,
                    left: rect.left,
                    width: rect.width,
                });
            });
        }

        let triggers = [];

        function cacheTriggers() {
            if (isLg()) {
                triggers = [
                    { el: yellow, stickAt: cache.get(yellow).docTop, unstickAt: cache.get(green).docTop },
                    { el: pink,   stickAt: cache.get(pink).docTop,   unstickAt: getDocTop(text3) },
                    { el: blue,   stickAt: cache.get(blue).docTop,   unstickAt: getDocTop(text1) },
                    { el: green,  stickAt: cache.get(green).docTop,  unstickAt: getDocTop(text2) },
                    { el: red,    stickAt: cache.get(red).docTop,    unstickAt: getDocTop(text3) },
                ];
            } else {
                const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
                triggers = [
                    { el: yellow, stickAt: cache.get(yellow).docTop, unstickAt: maxScroll * 0.4 },
                    { el: pink,   stickAt: cache.get(pink).docTop,   unstickAt: maxScroll * 0.9 },
                    { el: green,  stickAt: cache.get(green).docTop,  unstickAt: maxScroll * 0.7 },
                    { el: blue,   stickAt: cache.get(blue).docTop,   unstickAt: maxScroll * 0.6 },
                    { el: red,    stickAt: cache.get(red).docTop,    unstickAt: maxScroll * 0.9 },
                ];
            }
        }

        window.addEventListener('load', () => {
            cachePositions();
            cacheTriggers();
        });

        window.addEventListener('resize', () => {
            cachePositions();
            cacheTriggers();
        });

        window.addEventListener('scroll', () => {
            const scrollY = window.scrollY;

            triggers.forEach(({ el, stickAt, unstickAt }) => {
                const c = cache.get(el);
                if (scrollY >= stickAt && scrollY < unstickAt) {
                    el.style.position = 'fixed';
                    el.style.top = '0px';
                    el.style.left = c.left + 'px';
                    el.style.width = c.width + 'px';
                } else {
                    el.style.position = 'absolute';
                    el.style.top = '';
                    el.style.left = '';
                    el.style.width = '';
                }
            });
        });

    </script>
</div>
